<!DOCTYPE html>
<html class="no-js">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ name }} | {{ account_name }}</title>
  <meta name="name" content="{{ name }}">
  <meta name="description" content="{{ description }}">
  <meta name="og:type" content="website">
  <meta name="og:title" content="{{ name }} | {{ account_name }}">
  <meta name="og:description" content="{{ description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- [if lt IE 9]><script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js" type="text/javascript"></script><![endif] -->
  <script type="text/javascript">
    var landingPageUuid = '{{ uuid }}';
  </script>
  <script type="text/javascript">
   (function () {
      var TENANT_NAME = '{{ subdomain }}';
  
      var d = document;
      var sA = ['polyfills', 'js'];
  
      for (var i = 0; i < sA.length; i++) {
        var s = d.createElement('script');
        s.src = 'https://' + TENANT_NAME + '.marianaiframes.com/' + sA[i];
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
      }
    })();
  </script>
  <link href="https://assets.brandbot.com/landing-page-service/{{ env }}/css/app.css" rel=stylesheet>
</head>
<body>
  <div id="app" v-cloak></div>
  <script src="https://assets.brandbot.com/landing-page-service/{{ env }}/js/manifest.js"></script>
  <script src="https://assets.brandbot.com/landing-page-service/{{ env }}/js/vendor.js"></script>
  <script src="https://assets.brandbot.com/landing-page-service/{{ env }}/js/app.js"></script>
</body>
</html>
